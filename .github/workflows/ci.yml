name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request target
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          base=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          case "$base" in
            main|release/*) ;;
            *) echo "Pull requests must target main or a maintained release/* branch."; exit 1 ;;
          esac

  quality:
    name: Quality / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: make check-fmt
      - name: Vet
        run: go vet ./...
      - name: Behavioral tests and race detection
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o bin/xswap ./cmd/xswap

  windows-compile:
    name: Quality / windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      XSWAP_WINDOWS_BINARY: ${{ github.workspace }}\xswap.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Windows executable
        run: go build -trimpath -o xswap.exe ./cmd/xswap
      - name: Compile tests for Windows
        run: go test -c -o xswap.test.exe ./cmd/xswap
      - name: Windows integration tests
        run: go test -run '^TestWindows' ./cmd/xswap
